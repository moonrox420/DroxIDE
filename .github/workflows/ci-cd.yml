name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.75"
  QT_VERSION: "6.8"

jobs:
  # ========== Rust Core Tests ==========
  test-rust:
    name: Test Rust Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./ -> target"
      
      - name: Check formatting
        run: cargo fmt -- --check
      
      - name: Run clippy
        run: cargo clippy -- -D warnings
      
      - name: Run tests
        run: cargo test --verbose
      
      - name: Build release
        run: cargo build --release

  # ========== Qt UI Build (Windows) ==========
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: [test-rust]
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
      
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          modules: qt5compat
          cache: true
      
      - name: Install CMake
        uses: lukka/get-cmake@latest
      
      - name: Cache CMake build
        uses: actions/cache@v3
        with:
          path: build
          key: ${{ runner.os }}-cmake-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-cmake-
      
      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      
      - name: Build
        run: cmake --build build --config Release -j 4
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DroxIDE-Windows
          path: build/Release/DroxIDE.exe
          retention-days: 14

  # ========== Qt UI Build (Linux) ==========
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: [test-rust]
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            qt6-base-dev \
            qt6-tools-dev \
            libssl-dev \
            pkg-config
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      
      - name: Configure CMake
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      
      - name: Build
        run: cmake --build build --config Release -j 4
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DroxIDE-Linux
          path: build/DroxIDE
          retention-days: 14

  # ========== Qt UI Build (macOS) ==========
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: [test-rust]
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          brew install cmake ninja qt@6
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      
      - name: Configure CMake
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=$(brew --prefix qt@6)
      
      - name: Build
        run: cmake --build build --config Release -j 4
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DroxIDE-macOS
          path: build/DroxIDE.app
          retention-days: 14

  # ========== Security Audit ==========
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: [test-rust]
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      
      - name: Install cargo-audit
        run: cargo install cargo-audit
      
      - name: Run security audit
        run: cargo audit || true

  # ========== Docker Sandbox Build ==========
  build-docker:
    name: Build Docker Sandboxes
    runs-on: ubuntu-latest
    needs: [test-rust]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Python sandbox
        run: docker build -f docker/Dockerfile.py3.11 -t droxsandbox:py3.11 .
      
      - name: Build Rust sandbox
        run: docker build -f docker/Dockerfile.rust1.75 -t droxsandbox:rust1.75 .
      
      - name: Build Node.js sandbox
        run: docker build -f docker/Dockerfile.node20 -t droxsandbox:node20 .
      
      - name: Test sandboxes
        run: |
          docker run --rm droxsandbox:py3.11 python --version
          docker run --rm droxsandbox:rust1.75 rustc --version
          docker run --rm droxsandbox:node20 node --version

  # ========== Release ==========
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, build-macos, security-audit, build-docker]
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Create release archives
        run: |
          cd artifacts
          zip -r DroxIDE-Windows-x64.zip DroxIDE-Windows/
          tar czf DroxIDE-Linux-x64.tar.gz DroxIDE-Linux/
          tar czf DroxIDE-macOS-x64.tar.gz DroxIDE-macOS/
      
      - name: Upload release assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/DroxIDE-Windows-x64.zip
            artifacts/DroxIDE-Linux-x64.tar.gz
            artifacts/DroxIDE-macOS-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
